name: Kaggle 定时 GPU 任务

on:
  schedule:
    - cron: '0 1 * * 1-5'    # 每周一至周五 UTC 01:00（北京时间 09:00）
  workflow_dispatch:          # 手动触发：Actions 页 Run workflow（冒烟测试用）

permissions:
  contents: read

jobs:
  push-to-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # 只负责推送，不守着跑，几分钟足够
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Kaggle CLI
        run: pip install kaggle six

      # 凭证 fallback 统一由 .github/scripts/kaggle.sh 处理：
      # 优先 KAGGLE_API_TOKEN，未配置则退到 KAGGLE_USERNAME + KAGGLE_KEY
      - name: Push kernel to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: bash .github/scripts/kaggle.sh kernels push -p ./kaggle_task

      - name: Show status (best-effort)
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "${KAGGLE_API_TOKEN:-}" ] && { [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; }; then
            echo "No Kaggle credentials, skip status check"
            exit 0
          fi
          bash .github/scripts/kaggle.sh kernels status "yongyongwuvip/qwen36-35b-a3b-abliterated-mtp-gguf"
